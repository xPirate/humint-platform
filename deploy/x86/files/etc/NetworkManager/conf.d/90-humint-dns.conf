# Name lookups (DNS) for this machine come from the network it is on, and
# NetworkManager writes them into /etc/resolv.conf itself.
#
# Ubuntu's NetworkManager hands them to systemd-resolved instead — which is
# not installed here (nothing else needs it), so /etc/resolv.conf pointed at
# 127.0.0.53 and nothing answered: joined to a Wi-Fi with internet, nothing
# could be looked up — no online maps, no map downloads, no system updates.
[main]
dns=default
rc-manager=file
