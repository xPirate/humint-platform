# HUMINT field server: straight to the system, classic interface names
# (eth0/wlan0, which the networking scripts use, as on the Pi).
GRUB_DISTRIBUTOR="HUMINT"
GRUB_TIMEOUT=1
GRUB_TIMEOUT_STYLE=hidden
GRUB_CMDLINE_LINUX_DEFAULT="quiet loglevel=3 net.ifnames=0 biosdevname=0"
GRUB_DISABLE_OS_PROBER=true
