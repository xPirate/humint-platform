# A field server, not a laptop: closing the lid must not suspend it (the
# console would vanish for everyone connected). The power button shuts down
# cleanly, which locks the case file.
[Login]
HandleLidSwitch=ignore
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
HandleSuspendKey=ignore
HandleHibernateKey=ignore
HandlePowerKey=poweroff
IdleAction=ignore
